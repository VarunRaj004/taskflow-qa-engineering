spring:
  application:
    name: taskflow-demo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

---
# dev profile: real MySQL (e.g. via docker-compose), connects over DB_* env vars with
# localhost-friendly defaults. JWT_SECRET below is a DEV-ONLY placeholder — it is NOT safe to
# use outside a local machine. Any real deployment (CI, staging, production) MUST override
# JWT_SECRET with its own value via the environment; never hardcode a production secret here.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-1234567890}

---
# docker profile: same as dev, but intended for use when the backend itself also runs inside
# docker-compose (DB_HOST then typically points at the compose service name, e.g. "mysql").
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-1234567890}

---
# test profile: H2 in MySQL-compatibility mode, zero external dependencies. Used by `mvn test`.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:taskflow-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET:test-only-insecure-secret-do-not-use-in-production-1234567890}
