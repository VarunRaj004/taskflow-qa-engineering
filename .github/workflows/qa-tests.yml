name: TaskFlow QA tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  DB_NAME: taskflow
  DB_USER: taskflow
  DB_PASSWORD: taskflow-ci-only
  MYSQL_ROOT_PASSWORD: taskflow-root-ci-only

jobs:
  backend-unit-tests:
    name: Backend unit/integration tests (H2, no external deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aut-demo/backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests (test profile / H2)
        run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Upload backend surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-surefire-reports
          path: aut-demo/backend/target/surefire-reports
          if-no-files-found: ignore

  api-and-e2e-tests:
    name: API (Newman) and UI (Playwright) tests against a running build
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build backend
        working-directory: aut-demo/backend
        run: mvn -B -DskipTests package

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" --silent && break
            sleep 2
          done

      - name: Start backend (dev profile, against the MySQL service)
        working-directory: aut-demo/backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SERVER_PORT: '8090'
        run: |
          nohup java -jar target/*.jar > ../../backend-ci.log 2>&1 &
          echo "Waiting for backend to respond on :8090..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/api/dashboard -o /dev/null -w '%{http_code}' | grep -q 401 && break
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: aut-demo/frontend
        run: npm ci

      - name: Build frontend
        working-directory: aut-demo/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8090
        run: npm run build

      - name: Serve built frontend
        working-directory: aut-demo/frontend
        run: |
          npx --yes serve -s dist -l 5173 > ../../frontend-ci.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 -o /dev/null && break
            sleep 1
          done

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman/Newman API tests
        id: newman
        continue-on-error: true
        run: |
          mkdir -p reports/newman
          newman run api-testing/postman-collection.json \
            -e api-testing/postman-environment.example.json \
            --env-var baseUrl=http://localhost:8090 \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export reports/newman/report.html \
            --reporter-junit-export reports/newman/report.xml

      - name: Install Playwright
        working-directory: automation/playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright UI tests
        working-directory: automation/playwright
        env:
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8090
          CI: 'true'
        run: npx playwright test

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newman-report
          path: reports/newman
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report
          path: reports/playwright-html-report
          if-no-files-found: ignore

      - name: Upload Playwright traces/screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: reports/playwright-results
          if-no-files-found: ignore

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-logs
          path: |
            backend-ci.log
            frontend-ci.log
          if-no-files-found: ignore

      - name: Fail the job if Newman found API defects
        if: always()
        run: |
          if [ "${{ steps.newman.outcome }}" = "failure" ]; then
            echo "Newman reported one or more assertion failures - see the newman-report artifact."
            echo "As of this writing that is expected: BUG-001 and BUG-002 (documentation/defect-report.md) are known, open, low-severity defects that the collection deliberately asserts against the intended contract, not the current buggy behaviour. This step still fails the job per the specification's rule that a failing test must fail the workflow, rather than silently ignoring it."
            exit 1
          fi
